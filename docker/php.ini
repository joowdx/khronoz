; Production PHP settings for the Khronoz image.

memory_limit = 512M
expose_php = Off
date.timezone = Asia/Manila

upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; The code in this image never changes, so opcache never needs to stat it.
opcache.validate_timestamps = 0

; JIT is disabled. It is also inert while opcache.enable_cli = 0, since Octane
; runs under the CLI SAPI.
opcache.jit = disable
opcache.jit_buffer_size = 0

; Swoole is started by Octane with explicit flags; these are the process-level
; defaults only.
swoole.use_shortname = Off
